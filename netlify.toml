[build]
  command = "echo 'No build required'"
  functions = "netlify/functions/api"

# 1. Redirect /api/* to your serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. IMPORTANT: Do NOT rewrite /.netlify/* paths (functions live here)
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

# 3. Catch-all: serve index.html for any other route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200