[build]
  command = "echo 'No build required'"
  functions = "netlify/functions"

# 1. Redirect /api/* requests to your serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. Catch-all: serve index.html for any other route (SPA support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200